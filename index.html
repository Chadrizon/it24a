<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1> Todo list </h1>
 <input type="text"
        id="taskInput"
        placeholder="Add a task"
   />
   <button onclick="addTask()">Add Task</button>
   <ul id="tasklist">Your task go here ...</ul>


    <script>

 function getTaskTest(){
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    console.log("The input value is: " + input.value);
    return text;
}

function addTask(){
    const taskText = getTaskTest();
    addTaskItem(taskText);
    
}

function addTaskItem(taskText){
    const li = document.createElement("li");
    const taskSpan = document.createElement("span");
    taskSpan.textContent = taskText;
    li.appendChild(taskSpan);

    document.getElementById("tasklist").appendChild(li);

    // call createDoneButton
    const doneButton = createDoneButton(li);
    li.appendChild(doneButton);

    // call createEditButton
 
const editButton = createEditButton(li, taskSpan);
    li.appendChild(editButton);

//call createDeleteButton
   const deleteButton = createDeleteButton(li);
    li.appendChild(deleteButton);


}

function createDoneButton(li){   
    const doneButton = document.createElement("button");
    doneButton.textContent = "Done";

    doneButton.onclick = () => {
        console.log(11);
        li.classList.add("done");
        const buttons = li.querySelectorAll("button");

        buttons.forEach((button) => {
            button.disabled = true;
        });

        console.log("Task completed: ", li.textContent, Date.now());
    };
    return doneButton;
    
}

function createEditButton(li, taskSpan) {
    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.style.marginLeft = "8px";
    editButton.onclick = () => handedClick(li);

    return editButton;
}

function handedClick(li){
    const currentText = li.firstChild.textContent.trim();
    const newText = prompt("Edit your task:", currentText);

    if (newText !== null && newText.trim() !== "") {
        li.firstChild.textContent = newText.trim();
        alert(" Updated task");

    } else {
        alert(" No changes made.");
    }
}

function createDeleteButton(li) {
    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.style.marginLeft = "8px";
    deleteButton.onclick = () => handleDeleteClick(li); 
        
    return deleteButton;
}

function handleDeleteClick(li){
    li.remove();
    alert("Task deleted.");


}
</script>

</body> 
</html>
