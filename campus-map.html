<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Map</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 500px;
            flex: 1;
        }

        .popup-image {
            max-width: 200px;
            height: auto;
        }

        #location {
            width: 250px;
        }

        .location {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .location:hover {
            background: #eee;
        }

        .container {
            display: flex;
            gap: 15px;
        }
    </style>
</head>

<body>

    <h1>Simple Maps</h1>

    <div class="container">

        <div id="location">
            <h3>Locations</h3>
            <div id="location-list"></div>
        </div>

        <div id="map"></div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

    function initMap(mapDataUrl) {

        const map = L.map('map').setView([8.360, 124.868], 17);

        // OpenStreetMap Layer
        const openStreetmap = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }
        );

        // Satellite Layer
        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles &copy; Esri'
            }
        );

        // Default Layer
        satellite.addTo(map);

        // Fetch Map Data
        fetch(mapDataUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load campus-map.json");
                }
                return response.json();
            })
            .then(data => {

                data.forEach(pin => {

                    const marker = L.marker([
                        pin.lat,
                        pin.lng
                    ]).addTo(map);

                    const image = `
                        <img src="${pin.image}"
                        class="popup-image">
                    `;

                    marker.bindPopup(`
                        ${pin.title}
                        <br>
                        <hr>
                        ${image}
                    `);

                    // Location List
                    const item = document.createElement('div');

                    item.className = 'location';
                    item.textContent = pin.title;

                    document.getElementById('location-list')
                        .appendChild(item);

                    item.onclick = () => {
                        map.flyTo([pin.lat, pin.lng], 18);
                        marker.openPopup();
                    };

                });

                // Layer Control
                const baseMaps = {
                    "OpenStreetMap": openStreetmap,
                    "Satellite": satellite
                };

                L.control.layers(baseMaps).addTo(map);

            })
            .catch(error => {
                console.error("Map Error:", error);
                document.getElementById('location-list').textContent =
                    "Unable to load campus locations.";
            });
    }
